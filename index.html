<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birikim &amp; Borç Ödeme Defteri</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Birikim Defteri">
<style>
:root{
  --bg:#F3F5F8;
  --card:#FFFFFF;
  --card-border:#E7EAF0;
  --ink:#1C2541;
  --ink-soft:#6B7280;
  --ink-faint:#98A1B3;
  --accent:#147D77;
  --accent-soft:#E3F3F1;
  --accent-strong:#0E5F5A;
  --green:#1E9E5A;
  --green-soft:#E6F7EE;
  --red:#DC4C4C;
  --red-soft:#FDECEC;
  --amber:#C8862B;
  --amber-soft:#FBF0DE;
  --violet:#7C5CBF;
  --violet-soft:#F1ECFB;
  --radius:16px;
  --radius-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Courier New",monospace;
  --shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 24px -12px rgba(20,30,50,.12);
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:78px;
}
button{font-family:inherit;}
input{font-family:inherit;}

/* ===== App shell ===== */
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
}
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(243,245,248,.92); backdrop-filter:blur(10px);
  padding:16px 18px 14px;
  border-bottom:1px solid var(--card-border);
}
.topbar h1{
  font-size:20px; margin:0 0 2px; font-weight:800; letter-spacing:-.01em;
}
.topbar .sub{font-size:12.5px; color:var(--ink-soft); margin:0;}

.tabpage{padding:14px 16px 24px;}
.tabpage h2{font-size:18px; margin:2px 0 2px; font-weight:800;}
.tabpage .lead{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}

/* ===== Cards ===== */
.card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
}
.card-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.hero-card{
  background:linear-gradient(155deg,var(--accent),var(--accent-strong));
  color:#fff; border:none; border-radius:20px; padding:22px 20px; margin-bottom:14px;
  box-shadow:0 10px 28px -12px rgba(14,95,90,.55);
}
.hero-card .label{font-size:12px; opacity:.85; text-transform:uppercase; letter-spacing:.06em; font-weight:700;}
.hero-card .value{font-size:34px; font-weight:800; margin:6px 0 2px; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.hero-card .note{font-size:12px; opacity:.8;}
.hero-card.warn{background:linear-gradient(155deg,#DC4C4C,#A73434); box-shadow:0 10px 28px -12px rgba(167,52,52,.55);}
.hero-card.neutral{background:linear-gradient(155deg,#3A4A6B,#232C4F); box-shadow:0 10px 28px -12px rgba(35,44,79,.5);}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.stat-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius-sm);
  padding:13px 14px;
}
.stat-card .icon{
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:16px; margin-bottom:8px;
}
.stat-card .icon.green{background:var(--green-soft); color:var(--green);}
.stat-card .icon.red{background:var(--red-soft); color:var(--red);}
.stat-card .icon.amber{background:var(--amber-soft); color:var(--amber);}
.stat-card .icon.accent{background:var(--accent-soft); color:var(--accent-strong);}
.stat-card .icon.violet{background:var(--violet-soft); color:var(--violet);}
.stat-card .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
.stat-card .val{font-size:17px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums;}
.stat-card .val.red{color:var(--red);}
.stat-card .val.green{color:var(--green);}

.section-title{
  font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-soft); margin:18px 2px 8px; display:flex; justify-content:space-between; align-items:center;
}
.section-title span.amt{color:var(--ink); font-family:var(--font-mono); font-weight:700; text-transform:none; letter-spacing:0;}

/* ===== Inputs ===== */
.field-inline{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--card-border);
}
.field-inline:last-child{border-bottom:none;}
.field-inline .fname{font-size:13.5px; font-weight:600;}
.field-inline .fname .sub{display:block; font-size:10.5px; color:var(--ink-faint); font-weight:400;}
.num-box{
  border:1px solid var(--card-border); background:var(--bg); border-radius:9px;
  padding:8px 10px; font-size:14px; font-weight:700; text-align:right; width:118px;
  font-family:var(--font-mono); color:var(--ink);
}
.num-box:focus{outline:none; border-color:var(--accent);}
.name-box{
  border:none; background:transparent; font-size:14.5px; font-weight:700; color:var(--ink);
  padding:0; flex:1; min-width:0;
}
.name-box:focus{outline:none;}
.icon-btn{
  border:none; background:transparent; color:var(--ink-faint); cursor:pointer;
  width:26px; height:26px; border-radius:8px; font-size:13px;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{background:var(--bg); color:var(--ink);}
.icon-btn.danger:hover{background:var(--red-soft); color:var(--red);}

.add-row-btn{
  width:100%; border:1.5px dashed var(--card-border); background:transparent; color:var(--accent-strong);
  border-radius:var(--radius-sm); padding:11px; font-size:13.5px; font-weight:700; cursor:pointer; margin-top:2px;
}
.add-row-btn:hover{background:var(--accent-soft); border-color:var(--accent);}

/* ===== Debt card ===== */
.debt-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:14px 15px; margin-bottom:10px; box-shadow:var(--shadow);
}
.debt-card.paid{border-color:var(--green); background:var(--green-soft);}
.debt-card.missed{border-color:var(--red); background:var(--red-soft);}
.debt-card .dtop{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
.debt-card .dname{font-size:15px; font-weight:800; flex:1 1 100px; min-width:80px; border:none; background:transparent; padding:0; color:var(--ink);}
.debt-card .dname:focus{outline:none;}
.badge{
  font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
  padding:3px 8px; border-radius:999px;
}
.badge.kredi_karti{background:var(--amber-soft); color:var(--amber);}
.badge.kmh{background:var(--violet-soft); color:var(--violet);}
.badge.kredi{background:var(--accent-soft); color:var(--accent-strong);}
.badge.manuel{background:#EEF0F4; color:var(--ink-soft);}
.status-btn{
  width:22px; height:22px; border-radius:50%; border:1.5px solid var(--card-border); background:#fff;
  font-size:11px; font-weight:800; color:#fff; cursor:pointer; padding:0;
}
.status-btn.paid.on{background:var(--green); border-color:var(--green);}
.status-btn.missed.on{background:var(--red); border-color:var(--red);}
.move-col{display:flex; flex-direction:column; gap:1px;}
.move-col button{
  width:16px; height:14px; font-size:8px; border:1px solid var(--card-border); background:#fff;
  border-radius:3px; cursor:pointer; padding:0; color:var(--ink-faint);
}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
.chip{
  display:inline-flex; align-items:center; gap:4px; background:var(--bg); border:1px solid var(--card-border);
  border-radius:999px; padding:4px 10px; font-size:10.5px; color:var(--ink-soft); font-weight:600;
}
.chip input{
  border:none; background:transparent; width:32px; text-align:right; font-family:var(--font-mono);
  font-size:12px; color:var(--ink); padding:0; font-weight:700;
}
.chip input.wide{width:64px;}
.prog-track{height:6px; background:var(--card-border); border-radius:4px; overflow:hidden; margin:8px 0 3px;}
.prog-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); border-radius:4px;}
.prog-lbl{font-size:10px; color:var(--ink-faint); font-family:var(--font-mono);}
.debt-fields{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
.debt-fields .fw{flex:1; min-width:100px;}
.debt-fields label{display:block; font-size:10px; color:var(--ink-faint); font-weight:700; margin-bottom:3px; text-transform:uppercase; letter-spacing:.03em;}
.debt-fields input{width:100%;}
.debt-foot{display:flex; justify-content:flex-end; gap:6px; margin-top:8px;}

/* ===== Bottom tab bar (mobile) ===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:100;
  background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--card-border);
  display:flex; max-width:480px; margin:0 auto;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  border:none; background:transparent; color:var(--ink-faint); cursor:pointer; padding:6px 2px;
  font-size:10px; font-weight:700;
}
.tabbtn .ic{font-size:19px; line-height:1;}
.tabbtn.active{color:var(--accent-strong);}

/* ===== Empty / misc ===== */
.empty-hint{font-size:12px; color:var(--ink-faint); font-style:italic; padding:10px 0;}
.cal-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin-bottom:4px; -webkit-overflow-scrolling:touch;}
.cal-chip{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:var(--card); border:1.5px solid var(--card-border); border-radius:12px;
  padding:8px 12px; cursor:pointer; box-shadow:var(--shadow);
}
.cal-chip.active{border-color:var(--accent); background:var(--accent-soft);}
.cal-m{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
.cal-v{font-size:11.5px; font-family:var(--font-mono); font-weight:700; color:var(--ink); white-space:nowrap;}
.kk-select{
  font-size:10.5px; border:1px solid var(--card-border); border-radius:8px; padding:4px 6px; color:var(--ink-soft);
  background:#fff; margin-top:6px;
}
.transfer-note{font-size:10.5px; color:var(--accent-strong); background:var(--accent-soft); border-radius:8px; padding:6px 9px; margin-top:6px;}
.mini-link-btn{
  border:none; background:transparent; color:var(--accent-strong); font-size:11px; font-weight:700; cursor:pointer; text-decoration:underline;
}
.hidden-list{font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.9;}
.hidden-list button{
  border:1px solid var(--card-border); border-radius:10px; background:#fff; font-size:10px; padding:2px 8px; margin-left:4px; cursor:pointer;
}
.form-box{background:var(--bg); border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:12px; margin-top:8px;}
.form-box select, .form-box .num-box, .form-box .txt-box{width:100%; margin-bottom:8px;}
.txt-box{border:1px solid var(--card-border); background:#fff; border-radius:9px; padding:8px 10px; font-size:13px; width:100%;}
.form-box select{border:1px solid var(--card-border); background:#fff; border-radius:9px; padding:8px 10px; font-size:13px;}
.form-actions{display:flex; gap:8px; margin-top:4px;}
.btn{border:none; border-radius:9px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer;}
.btn.primary{background:var(--accent); color:#fff;}
.btn.ghost{background:#fff; border:1px solid var(--card-border); color:var(--ink-soft);}
.backup-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.backup-row label.btn{display:inline-flex; align-items:center;}

/* ===== Desktop / tablet ===== */
@media (min-width:900px){
  body{padding-bottom:0;}
  .app{max-width:1180px; display:grid; grid-template-columns:230px 1fr; min-height:100vh;}
  .sidebar{
    grid-row:1/3; background:#fff; border-right:1px solid var(--card-border);
    padding:22px 16px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  }
  .sidebar h1{font-size:17px; font-weight:800; margin:0 0 2px; padding:0 6px;}
  .sidebar .sub{font-size:11.5px; color:var(--ink-soft); margin:0 0 22px; padding:0 6px;}
  .sidebar .tabbtn{
    flex-direction:row; justify-content:flex-start; gap:10px; padding:11px 12px; border-radius:10px;
    font-size:13.5px; margin-bottom:3px;
  }
  .sidebar .tabbtn.active{background:var(--accent-soft);}
  .sidebar .tabbtn .ic{font-size:17px;}
  .tabbar{display:none;}
  .topbar{grid-column:2; max-width:none; padding:22px 32px 14px;}
  .tabpage{grid-column:2; max-width:920px; padding:18px 32px 40px;}
  .stat-grid{grid-template-columns:repeat(4,1fr);}
  .debt-grid-desktop{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .debt-grid-desktop .debt-card{margin-bottom:0;}
}

/* ===== Auth / Login screen ===== */
.auth-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; background:var(--bg);
}
.auth-card{
  width:100%; max-width:360px; background:var(--card); border:1px solid var(--card-border);
  border-radius:20px; padding:28px 24px; box-shadow:var(--shadow);
}
.auth-card h1{font-size:20px; font-weight:800; margin:0 0 2px; text-align:center;}
.auth-card .sub{font-size:12.5px; color:var(--ink-soft); text-align:center; margin:0 0 20px;}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
.auth-field input{
  width:100%; border:1px solid var(--card-border); background:var(--bg); border-radius:10px;
  padding:11px 12px; font-size:14px; color:var(--ink);
}
.auth-field input:focus{outline:none; border-color:var(--accent);}
.auth-btn{
  width:100%; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:800;
  background:var(--accent); color:#fff; cursor:pointer; margin-top:4px;
}
.auth-btn:disabled{opacity:.6;}
.auth-btn.secondary{background:transparent; color:var(--accent-strong); font-weight:700; margin-top:10px;}
.auth-error{
  background:var(--red-soft); color:var(--red); border-radius:9px; padding:9px 11px;
  font-size:12px; margin-bottom:12px; display:none;
}
.auth-error.show{display:block;}
.auth-links{display:flex; justify-content:space-between; margin-top:14px; font-size:12px;}
.auth-links button{border:none; background:transparent; color:var(--accent-strong); font-weight:700; cursor:pointer; padding:0; font-size:12px;}
.auth-loading{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px;}
.auth-config-warn{
  background:var(--amber-soft); color:var(--amber); border-radius:10px; padding:10px 12px;
  font-size:11.5px; margin-bottom:14px; line-height:1.5;
}
.signout-row{display:flex; justify-content:space-between; align-items:center; padding:2px 2px 10px;}
.signout-row .email{font-size:11.5px; color:var(--ink-soft);}
.signout-btn{border:1px solid var(--card-border); background:#fff; border-radius:9px; padding:6px 12px; font-size:11.5px; font-weight:700; color:var(--red); cursor:pointer;}
</style>
</head>
<body>

  function migrateOldIncome(parsed){
    if(!parsed.salaryFixed) return null;
    var sf = parsed.salaryFixed;
    var out = {};
    MONTHS.forEach(function(m){
      var sm = (parsed.salaryMonthly && parsed.salaryMonthly[m]) || {};
      var pazarGun = Number(sm.pazarGun||0), mesaiSaat = Number(sm.mesaiSaat||0);
      var toplam = Number(sf.netMaas||0)+Number(sf.sendika||0)+Number(sf.aile||0)+pazarGun*Number(sf.pazarRate||0)+mesaiSaat*Number(sf.mesaiRate||0);
      out[m] = {gelir: toplam};
    });
    return out;
  }

  function normalizeState(parsed){
    var def = defaultState();
    var out = Object.assign({}, def, parsed || {});

    var migratedIncome = migrateOldIncome(parsed || {});
    if(migratedIncome){
      out.salaryMonthly = migratedIncome;
    } else {
      out.salaryMonthly = out.salaryMonthly || {};
      MONTHS.forEach(function(m){
        var sm = out.salaryMonthly[m];
        if(!sm || typeof sm.gelir !== 'number'){ out.salaryMonthly[m] = {gelir:(sm&&sm.gelir)?Number(sm.gelir):0}; }
      });
    }

    out.borsaOran = Array.isArray(out.borsaOran) && out.borsaOran.length===12 ? out.borsaOran : def.borsaOran;
    out.expenses = Array.isArray(out.expenses) ? out.expenses : def.expenses;

    out.faturalar = (Array.isArray(out.faturalar) ? out.faturalar : def.faturalar).map(function(f){
      var amounts = f.monthlyAmounts;
      if(!Array.isArray(amounts)){
        if(f.amounts && typeof f.amounts === 'object'){
          amounts = [];
          for(var i=0;i<12;i++){ amounts.push(Number(f.amounts[i]||0)); }
        } else {
          var flat = Number(f.tutar||0);
          amounts = MONTHS.map(function(){return flat;});
        }
      }
      return {id:f.id||uid(), ad:f.ad||'Fatura', monthlyAmounts:amounts, cardTransfers:f.cardTransfers||{}};
    });

    if(!out.offBudgetExpenses){
      out.offBudgetExpenses = MONTHS.map(function(){return [];});
    } else if(!Array.isArray(out.offBudgetExpenses)){
      var arr = [];
      MONTHS.forEach(function(m){ arr.push(out.offBudgetExpenses[m] || []); });
      out.offBudgetExpenses = arr;
    }

    out.gold = (out.gold && typeof out.gold === 'object') ? out.gold : {ayar24:[], ayar22:[], guncelFiyat24:0, guncelFiyat22:0};
    ['ayar24','ayar22'].forEach(function(k){
      out.gold[k] = (Array.isArray(out.gold[k]) ? out.gold[k] : []).map(function(g){
        return {id:g.id || uid(), gram:Number(g.gram || 0), mi:Math.max(0, Math.min(11, Number(g.mi || 0)))};
      });
    });
    out.gold.guncelFiyat24 = Number(out.gold.guncelFiyat24||0);
    out.gold.guncelFiyat22 = Number(out.gold.guncelFiyat22||0);

    out.debts = (Array.isArray(out.debts) ? out.debts : def.debts).map(function(d,idx){
      return Object.assign({}, d, {
        payments:d.payments || {}, balanceOverrides:d.balanceOverrides || {}, additions:d.additions || {},
        paidMonths:d.paidMonths || {}, missedMonths:d.missedMonths || {}, hidden: !!d.hidden,
        sortOrder:(typeof d.sortOrder==='number')?d.sortOrder:idx,
        startMonthIndex:Math.max(0, Number(d.startMonthIndex || 0))
      });
    });
    out.ekBorclular = (Array.isArray(out.ekBorclular) ? out.ekBorclular : def.ekBorclular).map(function(d,idx){
      return Object.assign({}, d, {
        payments:d.payments || {}, balanceOverrides:d.balanceOverrides || {}, additions:d.additions || {},
        paidMonths:d.paidMonths || {}, missedMonths:d.missedMonths || {}, hidden: !!d.hidden,
        sortOrder:(typeof d.sortOrder==='number')?d.sortOrder:idx,
        startMonthIndex:Math.max(0, Number(d.startMonthIndex || 0))
      });
    });

    delete out.salaryFixed;
    return out;
  }

  function billAmountForMonth(f,i){ return (f.monthlyAmounts && f.monthlyAmounts[i]!==undefined) ? Number(f.monthlyAmounts[i]) : 0; }
  function billTotalForMonth(i){ return STATE.faturalar.reduce(function(s,f){return s+billAmountForMonth(f,i);},0); }
  function offBudgetTotalForMonth(i){ return (STATE.offBudgetExpenses[i]||[]).reduce(function(s,e){return s+Number(e.tutar||0);},0); }

  function transferredBillsForCard(cardId, targetMonth){
    var total = 0;
    STATE.faturalar.forEach(function(f){
      Object.keys(f.cardTransfers||{}).forEach(function(mi){
        var t = f.cardTransfers[mi];
        if(t && t.cardId===cardId && t.targetMonth===targetMonth){ total += Number(t.amount||0); }
      });
    });
    return total;
  }
  function additionsForDebt(d,i){
    var base = (d.additions && d.additions[i]) ? Number(d.additions[i]) : 0;
    return base + transferredBillsForCard(d.id, i);
  }

  function calcDebtSeries(d){
    var balances = new Array(12).fill(null);
    var paid = new Array(12).fill(null);
    var suggested = new Array(12).fill(null);
    var overrides = d.balanceOverrides || {};
    var bal = d.baslangic;
    for(var i=0;i<12;i++){
      if(i < d.startMonthIndex){ continue; }
      bal += additionsForDebt(d,i);
      var payment, sugg;
      if(d.tur === 'kredi_karti'){
        var faizli = bal * (1 + (Number(d.faizYuzde||0)/100));
        sugg = bal * ((Number(d.asgariYuzde||0) + Number(d.faizYuzde||0))/100);
        payment = (d.payments[i] !== undefined) ? d.payments[i] : sugg;
        bal = Math.max(0, faizli - payment);
      } else if(d.tur === 'kmh'){
        var faizliKmh = bal * (1 + (Number(d.faizYuzde||0)/100));
        sugg = bal * (Number(d.faizYuzde||0)/100);
        payment = (d.payments[i] !== undefined) ? d.payments[i] : sugg;
        bal = Math.max(0, faizliKmh - payment);
      } else if(d.tur === 'kredi'){
        sugg = Math.min(Number(d.taksit||0), bal);
        payment = (d.payments[i] !== undefined) ? d.payments[i] : sugg;
        bal = Math.max(0, bal - payment);
      } else {
        sugg = 0;
        payment = (d.payments[i] !== undefined) ? d.payments[i] : 0;
        bal = Math.max(0, bal - payment);
      }
      if(overrides[i] !== undefined){ bal = Math.max(0, overrides[i]); }
      balances[i]=bal; paid[i]=payment; suggested[i]=sugg;
    }
    return {balances:balances, paid:paid, suggested:suggested};
  }
  function calcEkSeries(d){
    var balances = new Array(12).fill(null);
    var paid = new Array(12).fill(null);
    var overrides = d.balanceOverrides || {};
    var bal = d.baslangic;
    for(var i=0;i<12;i++){
      if(i < d.startMonthIndex){ continue; }
      var payment = (d.payments[i] !== undefined) ? d.payments[i] : 0;
      bal = Math.max(0, bal - payment);
      if(overrides[i] !== undefined){ bal = Math.max(0, overrides[i]); }
      balances[i]=bal; paid[i]=payment;
    }
    return {balances:balances, paid:paid};
  }

  function salaryForMonth(i){
    var sm = STATE.salaryMonthly[MONTHS[i]] || {gelir:0};
    return {toplam: Number(sm.gelir||0)};
  }

  function monthTotals(i){
    var gelir = salaryForMonth(i).toplam;
    var expTotal = STATE.expenses.reduce(function(s,e){return s+Number(e.tutar||0);},0);
    var faturaTotal = billTotalForMonth(i);
    var hesapDisiTotal = offBudgetTotalForMonth(i);
    var debtPaidTotal = STATE.debts.reduce(function(s,d){
      if(i < d.startMonthIndex) return s;
      return s + (calcDebtSeries(d).paid[i]||0);
    },0);
    var ekPaidTotal = STATE.ekBorclular.reduce(function(s,d){
      if(i < d.startMonthIndex) return s;
      return s + (calcEkSeries(d).paid[i]||0);
    },0);
    var toplamGider = expTotal + faturaTotal + hesapDisiTotal + debtPaidTotal + ekPaidTotal;
    var netKalan = gelir - toplamGider;
    var odenenBorc = STATE.debts.concat(STATE.ekBorclular).reduce(function(s,d){
      if(i < d.startMonthIndex) return s;
      if(d.paidMonths && d.paidMonths[i]){
        var ser = (d.tur!==undefined) ? calcDebtSeries(d) : calcEkSeries(d);
        return s + (ser.paid[i]||0);
      }
      return s;
    },0);
    return {gelir:gelir, expTotal:expTotal, faturaTotal:faturaTotal, hesapDisiTotal:hesapDisiTotal,
      debtPaidTotal:debtPaidTotal, ekPaidTotal:ekPaidTotal, toplamGider:toplamGider, netKalan:netKalan,
      odenenBorc:odenenBorc, borcOdemeToplam:debtPaidTotal+ekPaidTotal, sabitGiderToplam:expTotal+faturaTotal};
  }

  function borsaSeries(){
    var vals = new Array(12).fill(0);
    var bal = 0;
    for(var i=0;i<12;i++){
      var oran = Number(STATE.borsaOran[i]||0)/100;
      var net = monthTotals(i).netKalan;
      bal = i===0 ? net : bal*(1+oran)+net;
      vals[i] = bal;
    }
    return vals;
  }

  function goldTotals(){
    var g24 = STATE.gold.ayar24.reduce(function(s,x){return s+x.gram;},0);
    var g22 = STATE.gold.ayar22.reduce(function(s,x){return s+x.gram;},0);
    var v24 = g24 * Number(STATE.gold.guncelFiyat24||0);
    var v22 = g22 * Number(STATE.gold.guncelFiyat22||0);
    return {g24:g24, g22:g22, v24:v24, v22:v22, toplam:v24+v22};
  }

  function currentDebtBalance(i){
    var d1 = STATE.debts.reduce(function(s,d){
      if(i<d.startMonthIndex) return s;
      return s + (calcDebtSeries(d).balances[i]||0);
    },0);
    var d2 = STATE.ekBorclular.reduce(function(s,d){
      if(i<d.startMonthIndex) return s;
      return s + (calcEkSeries(d).balances[i]||0);
    },0);
    return d1+d2;
  }

  function debtStartOfMonth(d, mi, isDebtList){
    if(mi < d.startMonthIndex) return 0;
    if(mi === d.startMonthIndex){
      return d.baslangic + (isDebtList ? additionsForDebt(d,mi) : 0);
    }
    var ser = isDebtList ? calcDebtSeries(d) : calcEkSeries(d);
    return ser.balances[mi-1] || 0;
  }

  function anaBorcStats(mi){
    var startTotal = 0, remainingTotal = 0;
    function process(d, isDebtList){
      if(mi < d.startMonthIndex) return;
      var start = debtStartOfMonth(d, mi, isDebtList);
      startTotal += start;
      var isPaid = d.paidMonths && d.paidMonths[mi];
      if(isPaid){
        var ser = isDebtList ? calcDebtSeries(d) : calcEkSeries(d);
        remainingTotal += Math.max(0, ser.balances[mi]||0);
      } else {
        remainingTotal += start;
      }
    }
    STATE.debts.forEach(function(d){ process(d, true); });
    STATE.ekBorclular.forEach(function(d){ process(d, false); });
    return {start:startTotal, remaining:remainingTotal};
  }

  function moveItem(listName,id,dir){
    var list = findList(listName);
    var groupKeyFn = (listName==='debts') ? function(x){return x.tur;} : function(){return '_all';};
    var item = list.filter(function(x){return x.id===id;})[0];
    if(!item) return;
    var gk = groupKeyFn(item);
    var siblings = list.filter(function(x){return groupKeyFn(x)===gk;}).sort(function(a,b){return (a.sortOrder||0)-(b.sortOrder||0);});
    var idx = siblings.findIndex(function(x){return x.id===id;});
    var swapIdx = idx+dir;
    if(swapIdx<0||swapIdx>=siblings.length) return;
    var tmp = siblings[idx].sortOrder; siblings[idx].sortOrder=siblings[swapIdx].sortOrder; siblings[swapIdx].sortOrder=tmp;
    save(); render();
  }

  function wireOpenForms(){
    var debtSlot = document.getElementById('addDebtSlot');
    if(debtSlot && pendingDebtForm){
      debtSlot.innerHTML = addDebtFormHtml();
      var turSel = document.getElementById('ndTur');
      var kkRow = document.getElementById('ndKKRow');
      var kmhInp = document.getElementById('ndKmhFaiz');
      var krInp = document.getElementById('ndTaksit');
      document.getElementById('ndAd').addEventListener('input', function(e){ pendingDebtForm.ad = e.target.value; });
      document.getElementById('ndBaslangic').addEventListener('input', function(e){ pendingDebtForm.baslangic = e.target.value; });
      document.getElementById('ndAsgari').addEventListener('input', function(e){ pendingDebtForm.asgari = e.target.value; });
      document.getElementById('ndFaiz').addEventListener('input', function(e){ pendingDebtForm.faiz = e.target.value; });
      kmhInp.addEventListener('input', function(e){ pendingDebtForm.kmhFaiz = e.target.value; });
      krInp.addEventListener('input', function(e){ pendingDebtForm.taksit = e.target.value; });
      document.getElementById('ndStartMonth').addEventListener('change', function(e){ pendingDebtForm.startMonth = parseInt(e.target.value,10); });
      turSel.addEventListener('change', function(){
        pendingDebtForm.tur = turSel.value;
        kkRow.style.display = turSel.value==='kredi_karti' ? 'flex' : 'none';
        kmhInp.style.display = turSel.value==='kmh' ? 'block' : 'none';
        krInp.style.display = turSel.value==='kredi' ? 'block' : 'none';
      });
      document.getElementById('ndCancel').addEventListener('click', function(){ pendingDebtForm = null; render(); });
      document.getElementById('ndSave').addEventListener('click', function(){
        var f = pendingDebtForm;
        var ad = (f.ad||'').trim() || 'Yeni Borç';
        var baslangic = parseNum(f.baslangic);
        var nd = {id:uid(), ad:ad, tur:f.tur, baslangic:baslangic, startMonthIndex:f.startMonth||0, payments:{}, balanceOverrides:{}, additions:{}, paidMonths:{}, missedMonths:{}, hidden:false, sortOrder:STATE.debts.length};
        if(f.tur==='kredi_karti'){ nd.asgariYuzde = parseNum(f.asgari)||20; nd.faizYuzde = parseNum(f.faiz)||5; }
        else if(f.tur==='kmh'){ nd.faizYuzde = parseNum(f.kmhFaiz)||5; }
        else if(f.tur==='kredi'){ nd.taksit = parseNum(f.taksit)||baslangic; }
        STATE.debts.push(nd);
        pendingDebtForm = null;
        rerender();
      });
    }
    var goldSlot = document.getElementById('addGoldSlot');
    if(goldSlot && pendingGoldForm){
      goldSlot.innerHTML = addGoldFormHtml();
      document.getElementById('ngAyar').addEventListener('change', function(e){ pendingGoldForm.ayar = e.target.value; });
      document.getElementById('ngGram').addEventListener('input', function(e){ pendingGoldForm.gram = e.target.value; });
      document.getElementById('ngAy').addEventListener('change', function(e){ pendingGoldForm.ay = parseInt(e.target.value,10); });
      document.getElementById('ngCancel').addEventListener('click', function(){ pendingGoldForm = null; render(); });
      document.getElementById('ngSave').addEventListener('click', function(){
        var f = pendingGoldForm;
        var gram = parseNum(f.gram);
        if(gram<=0){ window.alert('Lütfen 0’dan büyük bir gram değeri girin.'); return; }
        STATE.gold[f.ayar].push({id:uid(), gram:gram, mi:f.ay||0});
        pendingGoldForm = null;
        rerender();
      });
    }
  }

      anyDebt = true;
      var groupTotal = 0;
      html += '<div style="font-size:10px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px;">'+(GROUP_LABELS[turKey]||turKey)+'</div>';
      items.forEach(function(d){
        var bal = calcDebtSeries(d).balances[mi]||0;
        groupTotal += bal;
        html += '<div class="field-inline"><span class="fname">'+esc(d.ad)+'</span><span style="font-weight:800;font-family:var(--font-mono);">'+fmtShort(bal)+'</span></div>';
      });
      html += '<div class="field-inline" style="border-top:1.5px solid var(--card-border);"><span class="fname" style="font-weight:800;color:var(--accent-strong);">'+(GROUP_LABELS[turKey]||turKey)+' Toplamı</span><span style="font-weight:800;font-family:var(--font-mono);color:var(--accent-strong);">'+fmtShort(groupTotal)+'</span></div>';
    });
    var ekWithDebt = sortedVisibleEk().filter(function(d){return mi>=d.startMonthIndex;});
    if(ekWithDebt.length){
      anyDebt = true;
      var ekTotal = 0;
      html += '<div style="font-size:10px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px;">Ek Borçlular</div>';
      ekWithDebt.forEach(function(d){
        var bal = calcEkSeries(d).balances[mi]||0;
        ekTotal += bal;
        html += '<div class="field-inline"><span class="fname">'+esc(d.ad)+'</span><span style="font-weight:800;font-family:var(--font-mono);">'+fmtShort(bal)+'</span></div>';
      });
      html += '<div class="field-inline" style="border-top:1.5px solid var(--card-border);"><span class="fname" style="font-weight:800;color:var(--accent-strong);">Ek Borçlular Toplamı</span><span style="font-weight:800;font-family:var(--font-mono);color:var(--accent-strong);">'+fmtShort(ekTotal)+'</span></div>';
    }
    if(!anyDebt){ html += '<div class="empty-hint">Bu ay için kayıtlı borç yok.</div>'; }
    html += '</div>';

    html += '<div class="section-title">Birikim Dağılımı<span class="amt">'+fmtShort(netBirikim)+'</span></div>';
    html += '<div class="card">'+
      '<div class="field-inline"><span class="fname">Altın (24+22 Ayar)</span><span style="font-weight:800;font-family:var(--font-mono);">'+fmtShort(gt.toplam)+'</span></div>'+
      '<div class="field-inline"><span class="fname">Borsa / Nakit Birikim<span class="sub">Temmuz sonu kümülatif</span></span><span style="font-weight:800;font-family:var(--font-mono);">'+fmtShort(borsa[11])+'</span></div>'+
    '</div>';

    html += '<div class="section-title">Aylık Nakit Akışı <small style="text-transform:none;font-weight:600;">(12 ay, aşağı kaydırın)</small></div>';
    html += '<div class="stat-grid">';
    for(var i=0;i<12;i++){
      var mt = monthTotals(i);
      html += '<div class="stat-card'+(i===mi?' active-month':'')+'" style="'+(i===mi?'border-color:var(--accent);border-width:2px;':'')+'"><div class="lbl">'+MONTHS[i]+' '+MONTH_YEAR[i]+'</div>'+
        '<div class="val '+(mt.netKalan>=0?'green':'red')+'">'+fmtShort(mt.netKalan)+'</div>'+
        '<div style="font-size:10px;color:var(--ink-faint);margin-top:2px;">G '+fmtShort(mt.gelir)+' &middot; Ç '+fmtShort(mt.toplamGider)+'</div></div>';
    }
    html += '</div>';

    if(FIREBASE_CONFIGURED && fbAuth && fbAuth.currentUser){
      html += '<div class="section-title">Hesap</div>';
      html += '<div class="card"><div class="signout-row"><span class="email">'+esc(fbAuth.currentUser.email)+'</span><button type="button" class="signout-btn" data-action="sign-out">Çıkış Yap</button></div></div>';
    }

    html += '<div class="section-title">Veri Yönetimi</div>';
    html += '<div class="backup-row">'+
      '<button class="btn ghost" data-action="export-data">⇩ Yedek Al (.json)</button>'+
      '<label class="btn ghost">⇧ Yedekten Geri Yükle<input type="file" accept="application/json,.json" data-action="import-file" style="display:none;"></label>'+
    '</div>';

    return html;
  }

  var RENDERERS = {ozet:renderOzet, borclar:renderBorclar, giderler:renderGiderler, birikim:renderBirikim, genel:renderGenel};

  function buildShell(){
    var isDesktop = window.innerWidth >= 900;
    document.getElementById('sidebar').style.display = isDesktop ? 'flex' : 'none';

    var tabbarHtml = TABS.map(function(t){
      return '<button type="button" class="tabbtn'+(t.id===currentTab?' active':'')+'" data-tab="'+t.id+'"><span class="ic">'+t.icon+'</span>'+t.label+'</button>';
    }).join('');
    document.getElementById('tabbar').innerHTML = tabbarHtml;
    document.getElementById('sidebarTabs').innerHTML = tabbarHtml;

    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function(btn){
      btn.addEventListener('click', function(){
        currentTab = btn.dataset.tab;
        render();
      });
    });
  }

  function render(){
    var tabDef = TABS.filter(function(t){return t.id===currentTab;})[0] || TABS[0];
    document.getElementById('pageTitle').textContent = tabDef.label;
    document.getElementById('pageSub').textContent = MONTHS[currentMonth] + ' ' + MONTH_YEAR[currentMonth] + ' — ' + tabDef.sub;

    Array.prototype.forEach.call(document.querySelectorAll('.tabbtn'), function(btn){
      btn.classList.toggle('active', btn.dataset.tab===currentTab);
    });

    document.getElementById('tabpage').innerHTML = (RENDERERS[currentTab]||renderOzet)();
    wireOpenForms();
  }
  function rerender(){ save(); render(); }

  function handleInput(e){
    var t = e.target;
    var action = t.dataset.action;
    if(!action) return;
    var val = t.value;

    if(action==='income'){
      STATE.salaryMonthly[MONTHS[currentMonth]].gelir = parseNum(val);
      save();
      return;
    }
    if(action==='name'){
      var list = findList(t.dataset.list);
      var item = list.filter(function(x){return x.id===t.dataset.id;})[0];
      if(item){ item.ad = val; save(); }
      return;
    }
    if(action==='amt'){
      var list2 = findList(t.dataset.list);
      var item2 = list2.filter(function(x){return x.id===t.dataset.id;})[0];
      if(item2){ item2.tutar = parseNum(val); save(); }
      return;
    }
    if(action==='fatura-amt'){
      var f6 = STATE.faturalar.filter(function(x){return x.id===t.dataset.id;})[0];
      var mi6 = parseInt(t.dataset.mi,10);
      if(f6){ f6.monthlyAmounts[mi6] = parseNum(val); save(); }
      return;
    }
    if(action==='offbudget-name' || action==='offbudget-amt'){
      var mi7 = parseInt(t.dataset.mi,10);
      var offList = STATE.offBudgetExpenses[mi7]||[];
      var offItem = offList.filter(function(x){return x.id===t.dataset.id;})[0];
      if(offItem){
        if(action==='offbudget-name') offItem.ad = val; else offItem.tutar = Math.max(0,parseNum(val));
        save();
      }
      return;
    }
    if(action==='principal'){
      var pl = findList(t.dataset.list);
      var pi = pl.filter(function(x){return x.id===t.dataset.id;})[0];
      if(pi){ pi.baslangic = Math.max(0,parseNum(val)); save(); }
      return;
    }
    if(action==='balance'){
      var bl = findList(t.dataset.list);
      var bi = bl.filter(function(x){return x.id===t.dataset.id;})[0];
      var bmi = parseInt(t.dataset.mi,10);
      if(bi){
        bi.balanceOverrides = bi.balanceOverrides || {};
        if(String(val).trim()==='') delete bi.balanceOverrides[bmi]; else bi.balanceOverrides[bmi] = Math.max(0,parseNum(val));
        save();
      }
      return;
    }
    if(action==='pay'){
      var pl2 = findList(t.dataset.list);
      var pi2 = pl2.filter(function(x){return x.id===t.dataset.id;})[0];
      var pmi = parseInt(t.dataset.mi,10);
      if(pi2){
        if(String(val).trim()==='') delete pi2.payments[pmi]; else pi2.payments[pmi] = parseNum(val);
        save();
      }
      return;
    }
    if(action==='kk-rate'){
      var kl = findList(t.dataset.list);
      var ki = kl.filter(function(x){return x.id===t.dataset.id;})[0];
      if(ki){ ki[t.dataset.field] = Math.max(0,parseNum(val)); save(); }
      return;
    }
    if(action==='gold-price'){
      STATE.gold[t.dataset.field] = Math.max(0,parseNum(val));
      save();
      return;
    }
    if(action==='borsa-oran'){
      STATE.borsaOran[parseInt(t.dataset.i,10)] = parseNum(val);
      save();
      return;
    }
  }

  function onChange(e){
    var t = e.target;
    var action = t.dataset.action;
    if(!action) return;

    if(action==='fatura-to-kk'){
      var cardId = t.value;
      if(!cardId) return;
      var mi9 = parseInt(t.dataset.mi,10);
      var f9 = STATE.faturalar.filter(function(x){return x.id===t.dataset.id;})[0];
      var card9 = STATE.debts.filter(function(x){return x.id===cardId;})[0];
      if(!f9||!card9) return;
      var amt9 = billAmountForMonth(f9,mi9);
      if(amt9<=0 || mi9>=11){ t.value=''; return; }
      var cardName = card9.ad;
      if(!window.confirm('"'+f9.ad+'" faturasının '+fmtShort(amt9)+' tutarı bu ay sıfırlanacak ve '+cardName+' kartının '+MONTHS[mi9+1]+' ayı borcuna eklenecek. Onaylıyor musunuz?')){ t.value=''; return; }
      f9.cardTransfers = f9.cardTransfers || {};
      f9.cardTransfers[mi9] = {cardId:cardId, amount:amt9, targetMonth:mi9+1};
      f9.monthlyAmounts[mi9] = 0;
      rerender(); return;
    }
    if(action==='import-file'){
      var file = t.files && t.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          STATE = normalizeState(JSON.parse(ev.target.result));
          save(); render();
          window.alert('Yedek başarıyla geri yüklendi.');
        }catch(err){ window.alert('Dosya okunamadı. Bu uygulamadan alınmış bir .json yedek dosyası seçin.'); }
      };
      reader.readAsText(file);
      t.value=''; return;
    }
  }

  function onClick(e){
    var t = e.target.closest ? e.target.closest('[data-action]') : null;
    if(!t) return;
    var action = t.dataset.action;
    if(!action) return;

    if(action==='del'){
      var mi5 = t.dataset.mi!==undefined ? parseInt(t.dataset.mi,10) : null;
      var list = (t.dataset.list==='offbudget') ? (STATE.offBudgetExpenses[mi5]||[]) :
                 (t.dataset.list && t.dataset.list.indexOf('gold-')===0) ? STATE.gold[t.dataset.list.replace('gold-','')] :
                 findList(t.dataset.list);
      var idx = list.findIndex(function(x){return x.id===t.dataset.id;});
      if(idx>-1){ list.splice(idx,1); rerender(); }
      return;
    }
    if(action==='add-simple'){
      findList(t.dataset.list).push({id:uid(), ad:'Yeni Kalem', tutar:0});
      rerender(); return;
    }
    if(action==='add-fatura'){
      STATE.faturalar.push({id:uid(), ad:'Yeni Fatura', monthlyAmounts:new Array(12).fill(0), cardTransfers:{}});
      rerender(); return;
    }
    if(action==='add-offbudget'){
      STATE.offBudgetExpenses[currentMonth] = STATE.offBudgetExpenses[currentMonth] || [];
      STATE.offBudgetExpenses[currentMonth].push({id:uid(), ad:'Yeni Gider', tutar:0});
      rerender(); return;
    }
    if(action==='add-ek'){
      STATE.ekBorclular.push({id:uid(), ad:'Yeni Kişi', baslangic:0, startMonthIndex:currentMonth, payments:{}, balanceOverrides:{}, additions:{}, paidMonths:{}, missedMonths:{}, hidden:false, sortOrder:STATE.ekBorclular.length});
      rerender(); return;
    }
    if(action==='toggle-paid'){
      var lp = findList(t.dataset.list);
      var ip = lp.filter(function(x){return x.id===t.dataset.id;})[0];
      var mip = parseInt(t.dataset.mi,10);
      if(ip){
        ip.paidMonths = ip.paidMonths||{}; ip.missedMonths = ip.missedMonths||{};
        if(ip.paidMonths[mip]) delete ip.paidMonths[mip]; else { ip.paidMonths[mip]=true; delete ip.missedMonths[mip]; }
        rerender();
      }
      return;
    }
    if(action==='toggle-missed'){
      var lm = findList(t.dataset.list);
      var im = lm.filter(function(x){return x.id===t.dataset.id;})[0];
      var mim = parseInt(t.dataset.mi,10);
      if(im){
        im.missedMonths = im.missedMonths||{}; im.paidMonths = im.paidMonths||{};
        if(im.missedMonths[mim]) delete im.missedMonths[mim]; else { im.missedMonths[mim]=true; delete im.paidMonths[mim]; }
        rerender();
      }
      return;
    }
    if(action==='move-up'){ moveItem(t.dataset.list, t.dataset.id, -1); return; }
    if(action==='move-down'){ moveItem(t.dataset.list, t.dataset.id, 1); return; }
    if(action==='hide-item'){
      var lh = findList(t.dataset.list);
      var ih = lh.filter(function(x){return x.id===t.dataset.id;})[0];
      if(ih){ ih.hidden = true; rerender(); }
      return;
    }
    if(action==='show-item'){
      var ls = findList(t.dataset.list);
      var is = ls.filter(function(x){return x.id===t.dataset.id;})[0];
      if(is){ is.hidden = false; rerender(); }
      return;
    }
    if(action==='undo-bill-transfer'){
      var fu = STATE.faturalar.filter(function(x){return x.id===t.dataset.id;})[0];
      var miu = parseInt(t.dataset.mi,10);
      if(fu && fu.cardTransfers && fu.cardTransfers[miu]){
        fu.monthlyAmounts[miu] = fu.cardTransfers[miu].amount;
        delete fu.cardTransfers[miu];
        rerender();
      }
      return;
    }
    if(action==='sign-out'){
      if(fbAuth) fbAuth.signOut();
      return;
    }
    if(action==='export-data'){
      var blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'birikim-defteri-yedek-'+(new Date().toISOString().slice(0,10))+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      return;
    }
    if(action==='open-add-debt'){
      pendingDebtForm = {ad:'', tur:'kredi_karti', startMonth:currentMonth, baslangic:'', asgari:'20', faiz:'5', kmhFaiz:'5', taksit:''};
      render();
      return;
    }
    if(action==='jump-month'){
      currentMonth = parseInt(t.dataset.mi,10);
      render();
      return;
    }
    if(action==='open-add-gold'){
      pendingGoldForm = {ayar:'ayar24', gram:'', ay:currentMonth};
      render();
      return;
    }
  }

  document.getElementById('app').addEventListener('input', handleInput);
  document.getElementById('app').addEventListener('change', onChange);
  document.getElementById('app').addEventListener('click', onClick);
  window.addEventListener('resize', function(){ if(document.getElementById('app').style.display !== 'none'){ buildShell(); render(); } });

  function showApp(){
    document.getElementById('authWrap').style.display = 'none';
    document.getElementById('app').style.removeProperty('display');
    buildShell();
    render();
  }
  function showAuthScreen(){
    document.getElementById('app').style.display = 'none';
    document.getElementById('authWrap').style.display = 'flex';
    document.getElementById('authFormArea').style.display = 'block';
    document.getElementById('authLoading').style.display = 'none';
  }

  var authMode = 'signin';
  function showAuthError(msg, ok){
    var el = document.getElementById('authError');
    el.textContent = msg;
    el.style.background = ok ? 'var(--green-soft)' : 'var(--red-soft)';
    el.style.color = ok ? 'var(--green)' : 'var(--red)';
    el.classList.add('show');
  }
  function hideAuthError(){ document.getElementById('authError').classList.remove('show'); }
  function updateAuthModeUI(){
    document.getElementById('authSubmitBtn').textContent = authMode==='signin' ? 'Giriş Yap' : 'Kayıt Ol';
    document.getElementById('authToggleMode').textContent = authMode==='signin' ? 'Hesabınız yok mu? Kayıt olun' : 'Zaten hesabınız var mı? Giriş yapın';
    document.getElementById('authSub').textContent = authMode==='signin' ? 'Hesabınıza giriş yapın' : 'Yeni hesap oluşturun';
    hideAuthError();
  }
  function translateAuthError(err){
    var map = {
      'auth/email-already-in-use':'Bu e-posta adresi zaten kayıtlı. Giriş yapmayı deneyin.',
      'auth/invalid-email':'Geçersiz e-posta adresi.',
      'auth/user-not-found':'Bu e-posta ile kayıtlı bir hesap bulunamadı.',
      'auth/wrong-password':'Şifre yanlış.',
      'auth/invalid-credential':'E-posta veya şifre yanlış.',
      'auth/weak-password':'Şifre çok zayıf, en az 6 karakter olmalı.',
      'auth/too-many-requests':'Çok fazla deneme yapıldı, lütfen biraz bekleyin.',
      'auth/network-request-failed':'İnternet bağlantısı sorunu.'
    };
    return (err && map[err.code]) || ('Bir hata oluştu: ' + ((err && err.message) || 'bilinmeyen hata'));
  }

  if(FIREBASE_CONFIGURED && fbAuth && fbDb){
    document.getElementById('authToggleMode').addEventListener('click', function(){
      authMode = authMode==='signin' ? 'signup' : 'signin';
      updateAuthModeUI();
    });
    document.getElementById('authSubmitBtn').addEventListener('click', function(){
      hideAuthError();
      var email = document.getElementById('authEmail').value.trim();
      var pass = document.getElementById('authPassword').value;
      if(!email || !pass){ showAuthError('Lütfen e-posta ve şifrenizi girin.'); return; }
      if(authMode==='signup' && pass.length < 6){ showAuthError('Şifre en az 6 karakter olmalı.'); return; }
      document.getElementById('authFormArea').style.display = 'none';
      document.getElementById('authLoading').style.display = 'block';
      var action = authMode==='signin' ? fbAuth.signInWithEmailAndPassword(email,pass) : fbAuth.createUserWithEmailAndPassword(email,pass);
      action.catch(function(err){
        document.getElementById('authFormArea').style.display = 'block';
        document.getElementById('authLoading').style.display = 'none';
        showAuthError(translateAuthError(err));
      });
    });
    document.getElementById('authForgotBtn').addEventListener('click', function(){
      var email = document.getElementById('authEmail').value.trim();
      if(!email){ showAuthError('Şifre sıfırlama için önce e-posta adresinizi girin.'); return; }
      fbAuth.sendPasswordResetEmail(email).then(function(){
        showAuthError('Şifre sıfırlama bağlantısı e-postanıza gönderildi.', true);
      }).catch(function(err){ showAuthError(translateAuthError(err)); });
    });

    fbAuth.onAuthStateChanged(function(user){
      if(user){
        document.getElementById('authFormArea').style.display = 'none';
        document.getElementById('authLoading').style.display = 'block';
        loadStateFromCloud(user.uid).then(showApp);
      } else {
        showAuthScreen();
      }
    }, function(err){
      showAuthScreen();
      showAuthError('Bağlantı hatası: ' + ((err && err.message) || 'bilinmeyen hata'));
    });
  } else if(FIREBASE_CONFIGURED){
    document.getElementById('authFormArea').style.display = 'none';
    document.getElementById('authLoading').style.display = 'none';
    showAuthError('Firebase yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.');
  } else {
    document.getElementById('authConfigWarn').style.display = 'block';
    STATE = load();
    showApp();
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
